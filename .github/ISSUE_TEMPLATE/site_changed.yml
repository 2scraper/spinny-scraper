name: Site changed / selectors broke
description: Spinny changed something and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth its
        own report because the fix is different from a code bug: something on
        spinny.com moved.

        Useful to know before filing: a LISTING page carries no structured data
        about its cars — five JSON-LD blocks and not one names a vehicle — so
        the DOM is the only path there, and everything is anchored on
        `[data-id="landing-plp-container"]` and `a[href^="/buy-used-cars/"]`
        rather than on any class. A DETAIL page does have its own
        `["Product","Car"]` block. Which of those broke narrows the fix a lot.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - Cars (0 rows on a listing that visibly has cars)
        - A specific field is null or wrong (price, sku, image, URL)
        - original_price or discount_amount empty out
        - The all-in price is below the displayed price in the run log
        - The site's own advertised total is no longer read (completeness)
        - The scroll stops early, or `page` is 1 on every row
        - The captcha detector finds nothing on a page that has one
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The exact listing URL, and how the browser reached the site.
      placeholder: "https://www.spinny.com/used-cars-in-delhi-ncr/s/ (local Chromium, home connection — or: Scraping Browser pid spinny1)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the page
      description: |
        Whichever of these you can get. A capture beats a description.

        - JSON-LD as the page actually serves it:
          `python3 -c "import json,sys,re;h=open('dump.html').read();print([m[:400] for m in re.findall(r'<script type=\"application/ld\\+json\">(.*?)</script>',h,re.S)][:2])"`
        - Or open devtools and paste one `Product` node from the `ItemList`.
        - For a field problem: the value you got, and the value on the page.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, whether it reproduces from a
        different country, and when it last worked.
