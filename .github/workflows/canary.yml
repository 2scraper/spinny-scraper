name: canary

# tests.yml (deliberately) never touches spinny.com — see its own header for
# why. That leaves a real gap: a markup change on the site itself only shows
# up when a user hits it and files an issue, while the offline badge stays
# green throughout. This workflow is the other half — a real run against a
# real listing URL — so a site-side break is caught here first.
#
# THIS CANARY RUNS FROM A BARE RUNNER, WITH NO SECRET.
# ------------------------------------------------------------------------
# That is unusual in this family and it is measured rather than hoped for.
# Every sibling repo's canary is gated on a credential because its site
# refuses a datacentre address; Spinny refuses nothing. Measured 2026-09-11:
#
#   local Chromium, home connection, no key, no proxy    62 cars, exit 0
#   Amsterdam datacentre exit                            full grid
#   Chennai residential exit                             full grid
#   Scraping Browser API (--cdp-endpoint)                62 cars, exit 0
#
# So this canary is scheduled rather than dispatch-only, and it needs nothing
# configured to be useful. If SPINNY_CDP_ENDPOINT IS set it is used — that
# exercises the paid path too — and if it is not, the run goes ahead from the
# runner's own address. Either way the assertions below are the same.
#
# The secret, when present, is passed through the ENVIRONMENT, which
# env_config.py reads for exactly this variable, rather than through a
# --cdp-endpoint flag. A credential on a command line is readable by anything
# that can run `ps`, which is the rule this repo states and should therefore
# follow in its own CI; and an unset secret arrives as an empty string, which
# the loader already treats as "not configured", so one line is correct with
# and without it.
#
# If you do set it, use a `pid` reserved for CI. A profile allows ONE live
# connection, so a canary sharing a pid with a person's run gets
# `profile_locked` (exit 5), which says nothing about the site or the code.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

jobs:
  live-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Playwright engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-playwright.txt
          playwright install --with-deps chromium

      - name: Scrape a real, known-good city listing
        id: run
        # --pages 3, not 1. On this site a "page" is a BATCH OF 20 reached by
        # scrolling — ?page=N is silently ignored and returns page 1 — so
        # asking for one batch would exercise only the first paint and leave
        # the lazy-load loop, which is the only reason there are rows at all,
        # completely untested. Three batches makes the scroll run.
        #
        # A CITY listing rather than a filtered one: a filter can empty out
        # (the site's own zero-result page is a correct answer, and a canary
        # that goes red because a make sold out is a canary nobody reads),
        # while Delhi NCR has advertised between 1546 and 1566 cars across
        # runs minutes apart.
        #
        # set +e: GitHub Actions runs `run:` steps as `bash -e`, so without
        # this a non-zero scraper exit aborts the script on THAT line and the
        # `echo "exit_code=$?"` below never runs. continue-on-error only stops
        # the step from failing the job; it does not touch the shell's errexit.
        continue-on-error: true
        env:
          SPINNY_CDP_ENDPOINT: ${{ secrets.SPINNY_CDP_ENDPOINT }}
          TWOCAPTCHA_KEY: ${{ secrets.TWOCAPTCHA_KEY }}
        run: |
          set +e
          python3 playwright_scraper.py \
            --url "https://www.spinny.com/used-cars-in-delhi-ncr/s/" \
            --pages 3 --retries 4 --out canary_run --dump-html canary_run.html
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Interpret the exit code
        id: verdict
        # ONLY A RUN THAT TESTED THE SITE ENDS GREEN. Exit 0 is the one code
        # that passes, and only if the data assertions below pass too.
        #
        # A sibling repo's canary treats exit 3 as a warning because its site
        # refuses datacentre addresses as a matter of course. Spinny has never
        # been observed refusing anything, from any exit tested, so a blocked
        # run here is NEW INFORMATION and is failed rather than excused. If
        # that turns out to be wrong — if runners start being refused — the
        # honest fix is to change this and say why, not to leave a check that
        # is amber whatever happens.
        #
        # Exit 5 is "the content was never obtained": a navigation timeout, a
        # dead connection, or a refused Scraping Browser endpoint when the
        # optional secret is set. None of those tested the site, so none of
        # them may end green. If the log says `profile_locked`, another run
        # holds the pid; if the endpoint answered 401, the secret has expired
        # and should be removed, since this canary does not need it.
        run: |
          set -e
          code="${{ steps.run.outputs.exit_code }}"
          tested=false
          case "$code" in
            0)
              tested=true
              echo "OK — cars parsed from a live run." ;;
            5)
              echo "::error::The content was never obtained (exit 5): a navigation timeout, a dead connection, or (only when the optional SPINNY_CDP_ENDPOINT secret is set) a refused Scraping Browser endpoint. Nothing was tested, so this run is failed. If the log says 'profile_locked', another run holds this pid: give CI its own. If the endpoint answered 401, the secret has expired: remove it, and this canary runs from the runner's own address, which works on this site."
              echo "### Canary did NOT test anything (exit 5, content never obtained)" >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
            3)
              echo "::error::Blocked before parsing (exit 3). On this site that is NEW: no Spinny refusal has ever been observed, from a home connection, an Amsterdam datacentre exit, a Chennai residential exit or the Scraping Browser API. Check the byte count in the debug dump — 0 bytes means nothing came back at all, and a page that does not reference assets.spinny.com is Chromium's own error page rather than an interstitial. Either the site has started scoring addresses, or the runner's network is broken."
              echo "### Blocked (exit 3) — new behaviour for this site" >> "$GITHUB_STEP_SUMMARY"
              echo "Spinny has not been observed refusing any exit. Read the dump before assuming it is the runner." >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
            6)
              echo "::error::Partial run (exit 6) — the scroll budget ran out with the grid still growing and 60 cars not yet reached. The measured run needs two scroll rounds to pass 60, so this means the lazy-load loop is not making progress: the grid container or the card anchor has moved, or the site has slowed down a great deal."
              exit 1 ;;
            4)
              echo "::error::Ran fine but parsed 0 rows (exit 4) on a listing that advertises over 1500 cars. Either the grid container ([data-id=landing-plp-container]) or the card anchor (a[href^=/buy-used-cars/]) has moved — this is the regression this canary exists to catch. The HTML dump in the artefacts tells you which."
              exit 1 ;;
            2)
              echo "::error::Bad usage (exit 2) — the workflow's own arguments are wrong, not the site."
              exit 1 ;;
            *)
              echo "::error::Unexpected exit code $code (see the step above for the traceback)."
              exit 1 ;;
          esac
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

      - name: Sanity-check the scraped data
        if: steps.verdict.outputs.tested == 'true'
        # Exit 0 only means "some rows were written". It says nothing about
        # whether the page actually rendered: a snapshot taken too early
        # still writes rows, just with fields empty. The assertions live in
        # .github/canary_check.py so they can be run against a downloaded
        # artefact and by the offline suite; each one tests the parser or
        # the run, never a share of cars the site chose to discount or to
        # advertise with an EMI. That file says which floors were removed
        # and why.
        run: python3 .github/canary_check.py canary_run

      - name: Upload what the run produced
        # On EVERY run, not only on failure: a green canary's artefacts are
        # what the next investigation compares against.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-artefacts
          path: |
            canary_run.json
            canary_run.csv
            canary_run.meta.json
            canary_run.html*
            canary_run_page*_debug.html
          if-no-files-found: ignore
          retention-days: 14
